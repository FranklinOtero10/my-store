<td>{{product?.id}}</td>
<td>{{product?.title}}</td>
<td>${{product?.price}}</td>
<td>{{product?.category}}</td>
<td><img height="80px" [src]="product?.image"/></td>
<td>
  <!-- routerLink construye la URL /product/5, /product/12, etc. -->
  <a class="btn btn-success btn-sm"
     [routerLink]="['/product', product?.id]">
    Ver detalle
  </a>
</td>
