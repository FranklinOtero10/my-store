<div class="container mt-4">

  <!-- Estado de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border" role="status"></div>
    <p class="mt-2">Cargando producto...</p>
  </div>

  <!-- Estado de error -->
  <div *ngIf="error" class="alert alert-danger">{{error}}</div>

  <!-- Datos del producto -->
  <div *ngIf="detalle && !cargando; else sinResul">
    <div class="row">
      <div class="col-md-4 text-center">
        <img [src]="detalle.image" class="img-fluid" style="max-height:300px">
      </div>
      <div class="col-md-8">
        <h2>{{detalle.title}}</h2>
        <p class="h4 text-success">${{detalle.price}}</p>
        <p><strong>Categoria:</strong> {{detalle.category}}</p>
        <p><strong>Rating:</strong> {{detalle.rating?.rate}} ({{detalle.rating?.count}} resenas)</p>
        <p>{{detalle.description}}</p>
        <button class="btn btn-primary ms-4"
                *ngIf="authService.isLoggedIn()"
                (click)="agregarAlCarrito()">
          <i class="bi bi-cart-plus"></i> Agregar al carrito
        </button>
        <!-- Volver a la lista -->
        <a routerLink="/products" class="btn btn-secondary ms-2">
          <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
      </div>
    </div>
  </div>

  <ng-template #sinResul>
    <h3 class="text-center py-5">No existe ese producto.</h3>
    <a routerLink="/products" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
  </ng-template>

</div>
